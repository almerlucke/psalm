<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genny editor</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --dim: #6d6b64; --line: #dcd9d0; --accent: #2b6cb0;
  --bad: #b3261e; --good: #2e7d32; --note: #2b6cb0; --grid: #ecebe5; --key: #f0eee8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --panel: #1f1f24; --ink: #e8e6df; --dim: #98958c; --line: #33333a; --accent: #6aa9ee;
    --bad: #ff8a80; --good: #7fd18b; --note: #6aa9ee; --grid: #2a2a30; --key: #26262c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 15px; margin: 0; font-weight: 650; }
.name { color: var(--dim); font: 13px ui-monospace, monospace; overflow-wrap: anywhere; }
#changed { padding: 8px 16px; background: color-mix(in srgb, var(--accent) 14%, var(--panel)); border-bottom: 1px solid var(--line); }
#changed[hidden] { display: none; }
.spacer { flex: 1; }
button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
section > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
section > h2 .r { margin-left: auto; text-transform: none; letter-spacing: 0; }
textarea { flex: 1; min-height: 260px; width: 100%; resize: none; border: 0; outline: none; padding: 12px; background: transparent; color: var(--ink); font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; tab-size: 2; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
#status { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
#status.ok { color: var(--good); } #status.bad { color: var(--bad); font-family: ui-monospace, monospace; font-size: 12px; }
canvas { width: 100%; height: 220px; display: block; }
#log { margin: 0; padding: 8px 12px; font: 12px/1.5 ui-monospace, monospace; overflow: auto; max-height: 260px; color: var(--dim); white-space: pre-wrap; }
#log .error { color: var(--bad); } #log .warning { color: #b7791f; }
.held { padding: 8px 12px; font: 13px ui-monospace, monospace; color: var(--dim); }
.dirty { color: var(--accent); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Genny</h1>
  <button id="rename" title="a name for this plugin (without one it is named after its track, if the host says which, else its file)">Rename…</button>
  <select id="plugin" hidden></select>
  <span class="name" id="name" title="the file this plugin plays; untitled: the script is kept in the project only"></span>
  <span class="dirty" id="dirty"></span>
  <select id="kind" title="what the text is (a file says it by its name)" aria-label="kind">
    <option value="js">JavaScript</option>
    <option value="json">JSON spec</option>
  </select>
  <span class="spacer"></span>
  <select id="open" title="play a file of the folder of the plugin" aria-label="open a file"></select>
  <button id="newscript" title="a new script, kept in the project until it is saved as a file">New script</button>
  <button id="newspec" title="a new spec, kept in the project until it is saved as a file">New spec</button>
  <button id="saveas" title="write the text to a file; the plugin plays that file from then on">Save as…</button>
  <button id="revert" disabled>Revert</button>
  <button id="save" class="primary" disabled>Save <small>Ctrl+S</small></button>
</header>
<div id="changed" hidden>The file was changed on disk, and the plugin plays that version now. You have unsaved edits.
  <button id="loadit">Load the file's version</button> <button id="keepmine">Keep my edits</button></div>
<main>
  <section>
    <h2>Script <span class="r" id="kind"></span></h2>
    <textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="the text that plays"></textarea>
  </section>
  <div class="side">
    <section>
      <h2>Preview <span class="r" id="count"></span></h2>
      <div id="status"></div>
      <canvas id="roll" aria-label="the notes the text makes"></canvas>
    </section>
    <section>
      <h2>Held <span class="r">notes played into the plugin</span></h2>
      <div class="held" id="held">nothing</div>
    </section>
    <section style="flex:1">
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id)
const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']
const noteName = p => names[((p % 12) + 12) % 12] + (Math.floor(p / 12) - 1)
const post = (url, method, body) => fetch(url, { method, body, headers: { 'X-Genny': '1' } })

let plugin = new URLSearchParams(location.search).get('i')
let saved = ''        // the text the plugin plays, as last read or written here
let linked = false    // the plugin plays a file
let lastGen = null    // the generation of the text the plugin plays
let preview = null    // the last check
let timer = null

const isScript = () => linked ? /\.js$/.test($('name').textContent) : $('kind').value === 'js'
const q = () => 'i=' + plugin + '&script=' + (isScript() ? 1 : 0)

async function plugins() {
  const list = await (await fetch('/api/plugins')).json()
  const sel = $('plugin')
  sel.innerHTML = ''
  list.forEach(p => sel.add(new Option(p.name + (p.file !== p.name ? ' · ' + p.file : ''), p.i)))
  sel.hidden = list.length < 2
  if (!list.length) { $('status').textContent = 'No Genny plugin is running in the host.'; return false }
  if (plugin === null || !list.some(p => String(p.i) === String(plugin))) plugin = String(list[0].i)
  sel.value = plugin
  return true
}

async function files() {
  const f = await (await fetch('/api/files?i=' + plugin)).json()
  const sel = $('open')
  sel.innerHTML = ''
  sel.add(new Option('Open file…', ''))
  f.files.forEach(n => sel.add(new Option(n, n)))
  sel.value = ''
}

function showState(s) {
  document.title = s.name + ' · Genny editor'
  $('title').textContent = s.name
  linked = s.linked
  $('name').textContent = s.file
  $('kind').hidden = linked
  $('kind').value = s.script ? 'js' : 'json'
  $('kind').disabled = false
}

async function load() {
  await files()
  const s = await (await fetch('/api/state?text=1&i=' + plugin)).json()
  $('text').value = saved = s.text
  lastGen = s.gen
  showState(s)
  $('changed').hidden = true
  dirty()
  check()
}

function dirty() {
  const d = $('text').value !== saved
  $('dirty').textContent = d ? 'not saved' : ''
  $('save').disabled = $('revert').disabled = !d
  $('kind').title = d ? 'what the text is' : 'what the text is (a file says it by its name)'
}

async function check() {
  const text = $('text').value
  const r = await post('/api/check?' + q(), 'POST', text)
  if (!r.ok) { setStatus(false, await r.text()); return }
  preview = await r.json()
  if (text !== $('text').value) return // typed on meanwhile
  if (preview.ok) {
    setStatus(true, preview.count + ' notes in ' + (+preview.length.toFixed(3)) + ' beats')
    $('count').textContent = preview.count ? preview.count + ' notes' : ''
  } else {
    setStatus(false, preview.error)
    $('count').textContent = ''
  }
  draw()
}

function setStatus(ok, text) {
  const s = $('status')
  s.className = ok ? 'ok' : 'bad'
  s.textContent = text
}

function draw() {
  const c = $('roll'), dpr = window.devicePixelRatio || 1
  const w = c.clientWidth, h = c.clientHeight
  c.width = w * dpr; c.height = h * dpr
  const g = c.getContext('2d')
  g.scale(dpr, dpr)
  const css = getComputedStyle(document.documentElement)
  const col = n => css.getPropertyValue(n).trim()
  g.clearRect(0, 0, w, h)
  if (!preview || !preview.ok || !preview.notes.length) {
    g.fillStyle = col('--dim'); g.font = '13px system-ui'
    g.fillText(preview && preview.ok ? 'no notes' : '', 12, 24)
    return
  }
  const notes = preview.notes
  let lo = Math.min(...notes.map(n => n[2])), hi = Math.max(...notes.map(n => n[2]))
  lo = Math.floor(lo) - 1; hi = Math.ceil(hi) + 1
  const span = Math.max(hi - lo, 12)
  const len = preview.length, left = 34
  const x = b => left + (w - left - 6) * b / len, rowH = (h - 6) / span
  const y = p => h - 3 - (p - lo + 1) * rowH
  g.font = '10px system-ui'
  for (let p = lo; p <= lo + span; p++) {
    if ([1, 3, 6, 8, 10].includes(((p % 12) + 12) % 12)) { g.fillStyle = col('--key'); g.fillRect(left, y(p), w - left, rowH) }
    if (p % 12 === 0) { g.fillStyle = col('--dim'); g.fillText(noteName(p), 2, y(p) + rowH - 1) }
  }
  g.strokeStyle = col('--grid'); g.lineWidth = 1
  for (let b = 0; b <= len + 1e-9; b++) { const px = Math.round(x(b)) + .5; g.beginPath(); g.moveTo(px, 0); g.lineTo(px, h); g.stroke() }
  g.fillStyle = col('--note')
  for (const [s, e, p, v] of notes) {
    g.globalAlpha = .35 + .65 * Math.min(Math.max(v, 0), 1)
    const bh = Math.max(rowH - 1, 2)
    g.fillRect(x(s), y(p) + (rowH - bh) / 2, Math.max(x(e) - x(s), 2), bh)
  }
  g.globalAlpha = 1
}

async function refresh() {
  try {
    const s = await (await fetch('/api/state?i=' + plugin)).json()
    $('log').innerHTML = s.log.map(l => {
      const k = / (error|warning): /.exec(l)
      return '<div' + (k ? ' class="' + k[1] + '"' : '') + '>' + l.replace(/[&<]/g, c => c === '&' ? '&amp;' : '&lt;') + '</div>'
    }).join('')
    $('log').scrollTop = $('log').scrollHeight
    $('held').textContent = s.held.length ? s.held.map(noteName).join('  ') : 'nothing'
    if (s.gen !== lastGen) {
      // the plugin plays another text (the file was changed on disk, or another page saved): shown unless there are edits here
      if ($('text').value === saved) await load()
      else { lastGen = s.gen; $('changed').hidden = false }
    }
  } catch (e) { /* the host may be gone */ }
}

async function save() {
  if ($('save').disabled) return
  const text = $('text').value
  const r = await post('/api/save?' + q(), 'PUT', text)
  if (!r.ok) { setStatus(false, await r.text()); return }
  saved = text
  $('changed').hidden = true
  const s = await (await fetch('/api/state?i=' + plugin)).json()
  lastGen = s.gen
  dirty()
}

async function saveAs() {
  let name = prompt('Save as a file (letters, digits, . - _ ; it ends in .js or .json)', linked ? $('name').textContent : (isScript() ? 'my-script.js' : 'my-spec.json'))
  if (!name) return
  if (!/\.(js|json)$/.test(name)) name += isScript() ? '.js' : '.json'
  const text = $('text').value
  let r = await post('/api/saveas?i=' + plugin + '&name=' + encodeURIComponent(name), 'PUT', text)
  if (r.status === 409) {
    if (!confirm(name + ' exists. Write over it?')) return
    r = await post('/api/saveas?i=' + plugin + '&name=' + encodeURIComponent(name) + '&overwrite=1', 'PUT', text)
  }
  if (!r.ok) { alert(await r.text()); return }
  await plugins()
  await load()
}

async function openFile(name) {
  if (!name) return
  if ($('text').value !== saved && !confirm('Leave the unsaved edits?')) { await files(); return }
  const r = await post('/api/open?i=' + plugin + '&name=' + encodeURIComponent(name), 'PUT', '')
  if (!r.ok) { alert(await r.text()); await files(); return }
  await plugins()
  await load()
}

// a new text starts in the editor; the plugin plays it when it is saved. It stays untitled (kept in the project) until saved as a file
async function newText(kind) {
  if ($('text').value !== saved && !confirm('Leave the unsaved edits?')) return
  const t = await (await fetch('/api/template?kind=' + kind)).json()
  linked = false
  $('name').textContent = 'untitled'
  $('kind').hidden = false
  $('kind').value = kind
  $('text').value = t.text
  dirty()
  check()
}

$('text').addEventListener('input', () => { dirty(); clearTimeout(timer); timer = setTimeout(check, 350) })
$('text').addEventListener('keydown', e => {
  if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault()
    const t = e.target, a = t.selectionStart
    t.setRangeText('  ', a, t.selectionEnd, 'end')
    t.dispatchEvent(new Event('input'))
  }
})
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save() } })
$('save').onclick = save
$('saveas').onclick = saveAs
$('revert').onclick = () => { $('text').value = saved; dirty(); check() }
$('open').onchange = e => openFile(e.target.value)
$('newscript').onclick = () => newText('js')
$('newspec').onclick = () => newText('json')
$('kind').onchange = () => { dirty(); check() }
$('rename').onclick = async () => {
  const cur = $('title').textContent
  const name = prompt('A name for this plugin (empty: the name of its track, or its file)', cur)
  if (name === null) return
  const r = await post('/api/rename?i=' + plugin, 'PUT', name)
  if (!r.ok) { alert(await r.text()); return }
  await plugins()
  const s = await (await fetch('/api/state?i=' + plugin)).json()
  showState(s)
}
$('loadit').onclick = load
$('keepmine').onclick = () => { $('changed').hidden = true }
$('plugin').onchange = e => { plugin = e.target.value; load() }
addEventListener('resize', draw)
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw)

plugins().then(ok => { if (ok) { load(); setInterval(refresh, 1000) } })
</script>
</body>
</html>
