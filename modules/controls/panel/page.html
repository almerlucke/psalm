<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Panel</title>
<style>
:root {
	--bg: #f4f4f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #d8d8d4;
	--track: #e6e6e2; --accent: #2f6fdb; --accent-ink: #ffffff; --meter-low: #2fa36b;
	--meter-mid: #d9a514; --meter-high: #d94a3d; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #141416; --card: #1f1f22; --ink: #ececee; --muted: #9a9aa0; --line: #34343a;
		--track: #2c2c31; --accent: #5b8ff0; --accent-ink: #0e0e10; --shadow: none;
	}
}
* { box-sizing: border-box; }
body {
	margin: 0; background: var(--bg); color: var(--ink);
	font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
	-webkit-user-select: none; user-select: none; touch-action: manipulation;
}
header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 4px; flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
#status { width: 9px; height: 9px; border-radius: 50%; background: var(--meter-high); }
#status.on { background: var(--meter-low); }
main { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 16px 24px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px 12px; }
section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.control { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; }
.name { font-size: 12px; color: var(--muted); text-align: center; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.value { font-size: 12px; font-variant-numeric: tabular-nums; min-height: 16px; }

.fader { position: relative; width: 44px; height: 180px; touch-action: none; cursor: ns-resize; outline: none; }
.fader .track { position: absolute; left: 19px; top: 8px; bottom: 8px; width: 6px; border-radius: 3px; background: var(--track); }
.fader .fill { position: absolute; left: 19px; bottom: 8px; width: 6px; border-radius: 3px; background: var(--accent); }
.fader .thumb { position: absolute; left: 6px; width: 32px; height: 16px; margin-bottom: -8px; border-radius: 4px; background: var(--card); border: 2px solid var(--accent); }
.fader:focus-visible .thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

.knob { width: 56px; height: 56px; touch-action: none; cursor: ns-resize; outline: none; }
.knob .bg { fill: none; stroke: var(--track); stroke-width: 6; stroke-linecap: round; }
.knob .arc { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
.knob .dot { fill: var(--ink); }

button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 10px 14px; min-width: 64px; min-height: 44px; cursor: pointer; touch-action: manipulation; }
button.on, button.down { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-height: 44px; max-width: 160px; }

.meter { position: relative; width: 16px; height: 180px; border-radius: 4px; background: var(--track); overflow: hidden; }
.meter .rms { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, var(--meter-low) 0 70%, var(--meter-mid) 70% 90%, var(--meter-high) 90%); clip-path: inset(100% 0 0 0); }
.meter .peak { position: absolute; left: 0; right: 0; height: 2px; background: var(--ink); bottom: 0; }

header .spacer { flex: 1; }
#learn { min-height: 34px; padding: 6px 12px; font-size: 13px; }
#presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#presets button, #presets select, #presets input { min-height: 34px; min-width: 0; padding: 4px 10px; font-size: 13px; }
#presets input { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; width: 120px; }
#presets .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
#note { font-size: 12px; color: var(--muted); min-width: 0; }
#note.error { color: var(--meter-high); }
.cc { font-size: 11px; color: var(--muted); min-height: 14px; white-space: nowrap; }
.cc .unbind { display: none; margin-left: 4px; padding: 0 4px; border-radius: 4px; cursor: pointer; }
body.learn .cc .unbind { display: inline; }
body.learn .cc .unbind:hover { background: var(--track); color: var(--ink); }
body.learn .control.bindable { outline: 1px dashed var(--line); outline-offset: 4px; border-radius: 6px; cursor: pointer; }
body.learn .control.armed { outline: 2px solid var(--accent); animation: armed 1s ease-in-out infinite; }
@keyframes armed { 50% { outline-color: transparent; } }

/* grids */
.gridbox { display: flex; flex-direction: column; gap: 8px; min-width: 0; max-width: 100%; }
.gridbox.control { align-items: stretch; }
.gridhead { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.gridhead .name { max-width: none; margin-right: 6px; }
.gridhead button { min-width: 38px; min-height: 32px; padding: 4px 10px; }
.gridhead button.playing { box-shadow: inset 0 -3px 0 var(--meter-low); }
.gridhead .tools { display: flex; gap: 6px; align-items: center; margin-left: 10px; }
.gridhead select { min-height: 32px; padding: 4px 8px; font-size: 13px; }
.gridscroll { overflow-x: auto; max-width: calc(100vw - 64px); }
.steps { display: grid; gap: 3px; align-items: center; }
.rowname { font-size: 12px; color: var(--muted); padding-right: 8px; cursor: pointer; white-space: nowrap; }
.rowname:hover, .rowname.selected { color: var(--ink); }
.cell { position: relative; height: 34px; min-width: 20px; border-radius: 4px; background: var(--track); touch-action: none; cursor: pointer; }
.cell.beat { box-shadow: inset 2px 0 0 var(--line); }
.cell .fill { position: absolute; inset: 0; border-radius: 4px; background: var(--accent); opacity: 0; }
.cell .mark { position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); display: none; }
.cell.marked .mark { display: block; }
.cell.head { outline: 2px solid var(--ink); outline-offset: -2px; }
.cell.out { opacity: .3; }
.cell.selected { box-shadow: 0 0 0 2px var(--meter-mid); }
.inspector { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; border-top: 1px solid var(--line); padding-top: 10px; min-height: 24px; font-size: 12px; color: var(--muted); }
.inspector label { display: flex; flex-direction: column; gap: 4px; }
.inspector input[type=range] { width: 130px; accent-color: var(--accent); }
.inspector .title { color: var(--ink); font-weight: 600; align-self: center; }
.inspector button, .inspector select { min-height: 32px; padding: 4px 10px; font-size: 13px; }
</style>
</head>
<body>
<header><span id="status" title="connection"></span><h1 id="title">Panel</h1><span class="spacer"></span><span id="note"></span><span id="presets" hidden></span><button id="learn" title="Tap a control, then move a knob or fader on your MIDI controller">MIDI learn</button></header>
<main id="panel"></main>
<script>
"use strict";
const widgets = {};       // name -> {param, show(value)}
const touching = new Set(); // controls being moved here: their echoes from the patch are ignored

const clamp01 = x => Math.max(0, Math.min(1, x));
function position(p, v) {
	if (p.max === p.min) return 0;
	return clamp01(p.curve === "exp" ? Math.log(v / p.min) / Math.log(p.max / p.min) : (v - p.min) / (p.max - p.min));
}
function valueAt(p, x) {
	x = clamp01(x);
	let v = p.curve === "exp" ? p.min * Math.pow(p.max / p.min, x) : p.min + (p.max - p.min) * x;
	if (p.step > 0) v = p.min + Math.round((v - p.min) / p.step) * p.step;
	return Math.max(Math.min(p.min, p.max), Math.min(Math.max(p.min, p.max), v));
}
function format(p, v) {
	const a = Math.abs(v);
	const text = p.step >= 1 ? v.toFixed(0) : a >= 1000 ? v.toFixed(0) : a >= 100 ? v.toFixed(1) : v.toFixed(2);
	return p.unit ? text + " " + p.unit : text;
}

// sending: at most one request per control per frame, the last value wins
const pending = new Map();
let scheduled = false;
function send(name, value) {
	pending.set(name, value);
	if (scheduled) return;
	scheduled = true;
	requestAnimationFrame(() => {
		scheduled = false;
		for (const [n, v] of pending) post("/api/set", {name: n, value: v});
		pending.clear();
	});
}
function post(url, body) {
	return fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}).catch(() => {});
}

// a vertical drag on an element: from its height (a fader) or relative to where it started (a knob)
function drag(el, p, getPos, onMove, relative) {
	let startY = 0, startPos = 0;
	el.addEventListener("pointerdown", e => {
		el.setPointerCapture(e.pointerId);
		touching.add(p.name);
		startY = e.clientY; startPos = getPos();
		move(e);
		e.preventDefault();
	});
	const move = e => {
		if (!el.hasPointerCapture(e.pointerId)) return;
		let x;
		if (relative) {
			x = startPos + (startY - e.clientY) / (e.shiftKey ? 600 : 150);
		} else {
			const r = el.getBoundingClientRect();
			x = 1 - (e.clientY - r.top - 8) / (r.height - 16);
		}
		onMove(clamp01(x));
	};
	el.addEventListener("pointermove", move);
	const up = e => { if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId); touching.delete(p.name); };
	el.addEventListener("pointerup", up);
	el.addEventListener("pointercancel", up);
	el.addEventListener("dblclick", () => onMove(position(p, p.default)));
	el.addEventListener("keydown", e => {
		const step = e.shiftKey ? 0.1 : 0.01;
		if (e.key === "ArrowUp" || e.key === "ArrowRight") { onMove(clamp01(getPos() + step)); e.preventDefault(); }
		if (e.key === "ArrowDown" || e.key === "ArrowLeft") { onMove(clamp01(getPos() - step)); e.preventDefault(); }
	});
}

function labelled(p, inner, valueEl) {
	const box = document.createElement("div");
	box.className = "control";
	const name = document.createElement("div");
	name.className = "name"; name.textContent = p.label || p.name; name.title = p.name;
	box.append(name, inner);
	if (valueEl) box.append(valueEl);
	return box;
}

function fader(p) {
	const el = document.createElement("div");
	el.className = "fader"; el.tabIndex = 0;
	el.innerHTML = '<div class="track"></div><div class="fill"></div><div class="thumb"></div>';
	const fill = el.querySelector(".fill"), thumb = el.querySelector(".thumb");
	const val = document.createElement("div"); val.className = "value";
	let pos = 0;
	const show = v => {
		pos = position(p, v);
		const px = `calc(8px + ${pos} * (100% - 16px))`;
		thumb.style.bottom = px; fill.style.height = `calc(${pos} * (100% - 16px))`;
		val.textContent = format(p, v);
	};
	drag(el, p, () => pos, x => { const v = valueAt(p, x); show(v); send(p.name, v); }, false);
	return {el: labelled(p, el, val), show};
}

function knob(p) {
	const ns = "http://www.w3.org/2000/svg";
	const svg = document.createElementNS(ns, "svg");
	svg.setAttribute("viewBox", "0 0 56 56"); svg.setAttribute("class", "knob"); svg.setAttribute("tabindex", "0");
	const arc = (from, to) => {
		const pt = a => [28 + 22 * Math.cos(a), 28 + 22 * Math.sin(a)];
		const [x1, y1] = pt(from), [x2, y2] = pt(to);
		return `M ${x1} ${y1} A 22 22 0 ${to - from > Math.PI ? 1 : 0} 1 ${x2} ${y2}`;
	};
	const start = Math.PI * 0.75, sweep = Math.PI * 1.5;
	const bg = document.createElementNS(ns, "path"); bg.setAttribute("class", "bg"); bg.setAttribute("d", arc(start, start + sweep));
	const fg = document.createElementNS(ns, "path"); fg.setAttribute("class", "arc");
	const dot = document.createElementNS(ns, "circle"); dot.setAttribute("class", "dot"); dot.setAttribute("r", "3");
	svg.append(bg, fg, dot);
	const val = document.createElement("div"); val.className = "value";
	let pos = 0;
	const show = v => {
		pos = position(p, v);
		const a = start + sweep * pos;
		fg.setAttribute("d", pos > 0.001 ? arc(start, a) : "");
		dot.setAttribute("cx", 28 + 13 * Math.cos(a)); dot.setAttribute("cy", 28 + 13 * Math.sin(a));
		val.textContent = format(p, v);
	};
	drag(svg, p, () => pos, x => { const v = valueAt(p, x); show(v); send(p.name, v); }, true);
	return {el: labelled(p, svg, val), show};
}

function toggle(p) {
	const b = document.createElement("button");
	b.textContent = p.label || p.name; b.title = p.name;
	let on = false;
	const show = v => { on = v >= 0.5; b.classList.toggle("on", on); };
	b.addEventListener("click", () => { show(on ? 0 : 1); send(p.name, on ? 1 : 0); });
	const box = document.createElement("div"); box.className = "control"; box.append(b);
	return {el: box, show};
}

function button(p) {
	const b = document.createElement("button");
	b.textContent = p.label || p.name; b.title = p.name;
	b.addEventListener("pointerdown", () => { b.classList.add("down"); post("/api/press", {name: p.name}); });
	const up = () => b.classList.remove("down");
	b.addEventListener("pointerup", up); b.addEventListener("pointerleave", up);
	b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") post("/api/press", {name: p.name}); });
	const box = document.createElement("div"); box.className = "control"; box.append(b);
	return {el: box, show: () => {}};
}

function choice(p) {
	const s = document.createElement("select");
	p.options.forEach((o, i) => { const opt = document.createElement("option"); opt.value = i; opt.textContent = o; s.append(opt); });
	s.addEventListener("change", () => send(p.name, Number(s.value)));
	return {el: labelled(p, s), show: v => { s.value = String(Math.round(v)); }};
}

function meter(p) {
	const el = document.createElement("div");
	el.className = "meter";
	el.innerHTML = '<div class="rms" style="top:0"></div><div class="peak"></div>';
	const rms = el.querySelector(".rms"), peak = el.querySelector(".peak");
	const height = db => clamp01((db + 60) / 60); // -60 to 0 dB
	const val = document.createElement("div"); val.className = "value";
	return {
		el: labelled(p, el, val),
		show: () => {},
		levels: ([pk, r]) => {
			rms.style.clipPath = `inset(${(1 - height(r)) * 100}% 0 0 0)`;
			peak.style.bottom = `calc(${height(pk) * 100}% - 2px)`;
			val.textContent = pk <= -119 ? "-∞" : pk.toFixed(1);
		},
	};
}


// a grid: patterns, rows of steps (the first field is the level: 0 is off), an inspector for the
// fields of a cell and tools for a row
function grid(p) {
	const d = p.grid, F = d.fields.length, R = d.rows.length, S = d.steps;
	let cells = d.cells.slice(), pattern = d.pattern, playing = d.playing;
	let heads = d.rows.map(() => -1), lengths = d.lengths || d.rows.map(() => S);
	let selected = null, selectedRow = null;
	const idx = (pt, r, s, f) => ((pt * R + r) * S + s) * F + f;
	const level = d.fields[0];
	const onValue = level.min + (level.max - level.min) * 0.8;
	const isOn = (r, s) => cells[idx(pattern, r, s, 0)] > level.default;
	const div = cls => { const e = document.createElement("div"); e.className = cls; return e; };

	const el = div("gridbox control");
	const head = div("gridhead");
	const title = div("name"); title.textContent = p.name;
	head.append(title);
	const patButtons = [];
	for (let i = 0; i < d.patterns && d.patterns > 1; i++) {
		const b = document.createElement("button");
		b.textContent = i < 26 ? String.fromCharCode(65 + i) : String(i + 1);
		b.title = "pattern " + b.textContent;
		b.addEventListener("click", () => { pattern = i; render(); post("/api/grid", {name: p.name, pattern: i}); });
		head.append(b); patButtons.push(b);
	}
	// the pattern on view: copy it to another, or clear it
	const hasHits = pt => { for (let r = 0; r < R; r++) for (let s = 0; s < S; s++) if (cells[idx(pt, r, s, 0)] > level.default) return true; return false; };
	const letter = i => i < 26 ? String.fromCharCode(65 + i) : String(i + 1);
	const patTools = div("tools");
	let copyTo = null;
	if (d.patterns > 1) {
		copyTo = document.createElement("select");
		copyTo.title = "the pattern to copy to";
		for (let i = 0; i < d.patterns; i++) { const o = document.createElement("option"); o.value = i; o.textContent = "to " + letter(i); copyTo.append(o); }
		const copy = document.createElement("button");
		copy.textContent = "Copy";
		copy.title = "copy this pattern to another";
		copy.addEventListener("click", () => {
			const dst = Number(copyTo.value), list = [];
			if (dst === pattern) return;
			if (hasHits(dst) && !confirm(`Pattern ${letter(dst)} has steps: replace them with ${letter(pattern)}?`)) return;
			for (let r = 0; r < R; r++) for (let s = 0; s < S; s++) for (let f = 0; f < F; f++) list.push([dst, r, s, f, cells[idx(pattern, r, s, f)]]);
			setCells(list);
			note(`copied ${letter(pattern)} to ${letter(dst)}`);
		});
		patTools.append(copy, copyTo);
	}
	const clear = document.createElement("button");
	clear.textContent = "Clear";
	clear.title = "clear this pattern";
	clear.addEventListener("click", () => {
		if (hasHits(pattern) && !confirm(`Clear pattern ${letter(pattern)}?`)) return;
		const list = [];
		for (let r = 0; r < R; r++) for (let s = 0; s < S; s++) d.fields.forEach((f, i) => list.push([pattern, r, s, i, f.default]));
		setCells(list);
	});
	patTools.append(clear);
	head.append(patTools);
	const scroll = div("gridscroll"), table = div("steps");
	table.style.gridTemplateColumns = `auto repeat(${S}, minmax(20px, 1fr))`;
	const cellEls = [], rowEls = [];
	d.rows.forEach((name, r) => {
		const rn = div("rowname"); rn.textContent = name; rn.title = "tools for " + name;
		rn.addEventListener("click", () => { selected = null; selectedRow = r; render(); inspect(); });
		table.append(rn); rowEls.push(rn);
		cellEls[r] = [];
		for (let s = 0; s < S; s++) {
			const c = div("cell" + (s % 4 === 0 ? " beat" : ""));
			c.innerHTML = '<div class="fill"></div><div class="mark"></div>';
			c.dataset.r = r; c.dataset.s = s;
			table.append(c); cellEls[r][s] = c;
		}
	});
	scroll.append(table);
	const insp = div("inspector");
	el.append(head, scroll, insp);

	// sending: change cells here at once, then tell the panel
	function setCells(list) {
		if (!list.length) return;
		for (const [pt, r, s, f, v] of list) cells[idx(pt, r, s, f)] = v;
		render(); inspect(true);
		post("/api/grid", {name: p.name, set: list});
	}
	const cellSet = (r, s, f, v) => [pattern, r, s, f, v];

	// tap toggles, a drag paints, a long press, right click or shift click opens the cell
	let paint = null, start = null, timer = null, dragged = false;
	const cellAt = e => { const u = document.elementFromPoint(e.clientX, e.clientY); return u && u.closest(".cell"); };
	const open = (r, s) => { selected = {r, s}; selectedRow = null; render(); inspect(); };
	table.addEventListener("contextmenu", e => { const c = e.target.closest(".cell"); if (c) { e.preventDefault(); open(+c.dataset.r, +c.dataset.s); } });
	table.addEventListener("pointerdown", e => {
		const c = e.target.closest(".cell");
		if (!c || e.button === 2) return;
		e.preventDefault();
		const r = +c.dataset.r, s = +c.dataset.s;
		if (e.shiftKey) { open(r, s); return; }
		table.setPointerCapture(e.pointerId);
		start = {r, s}; dragged = false;
		paint = isOn(r, s) ? level.default : onValue;
		timer = setTimeout(() => { timer = null; paint = null; open(r, s); }, 450);
	});
	table.addEventListener("pointermove", e => {
		if (paint === null || !table.hasPointerCapture(e.pointerId)) return;
		const c = cellAt(e);
		if (!c) return;
		const r = +c.dataset.r, s = +c.dataset.s;
		if (!dragged && r === start.r && s === start.s) return;
		if (timer) { clearTimeout(timer); timer = null; }
		const list = [];
		if (!dragged && cells[idx(pattern, start.r, start.s, 0)] !== paint) list.push(cellSet(start.r, start.s, 0, paint));
		dragged = true;
		if (cells[idx(pattern, r, s, 0)] !== paint) list.push(cellSet(r, s, 0, paint));
		setCells(list);
	});
	const up = e => {
		if (!table.hasPointerCapture(e.pointerId)) return;
		table.releasePointerCapture(e.pointerId);
		if (timer) { clearTimeout(timer); timer = null; if (!dragged && paint !== null) setCells([cellSet(start.r, start.s, 0, paint)]); }
		paint = null;
	};
	table.addEventListener("pointerup", up);
	table.addEventListener("pointercancel", e => { if (timer) clearTimeout(timer); timer = null; paint = null; up(e); });

	// the inspector: the fields of the open cell, or the tools of a row
	const option = (f, v) => { const o = f.options[Math.round(v - f.min)]; return o === undefined ? String(v) : o; };
	const fmt = (f, v) => f.options && f.options.length ? option(f, v) :
		(f.step >= 1 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2)) + (f.unit ? " " + f.unit : "");
	function inspect(refresh) {
		if (refresh) { // keep what is being moved, update the rest
			insp.querySelectorAll("[data-f]").forEach(input => {
				if (input === document.activeElement || !selected) return;
				const f = +input.dataset.f, v = cells[idx(pattern, selected.r, selected.s, f)];
				input.value = v;
				const out = input.parentElement.querySelector("output");
				if (out) out.textContent = fmt(d.fields[f], v);
			});
			return;
		}
		insp.innerHTML = "";
		if (selected) {
			const {r, s} = selected;
			const t = div("title"); t.textContent = `${d.rows[r]} · step ${s + 1}`; insp.append(t);
			d.fields.forEach((f, i) => {
				const label = document.createElement("label");
				const v = cells[idx(pattern, r, s, i)];
				if (f.options && f.options.length) {
					label.textContent = f.name;
					const sel = document.createElement("select"); sel.dataset.f = i;
					f.options.forEach((o, k) => { const opt = document.createElement("option"); opt.value = f.min + k; opt.textContent = o; sel.append(opt); });
					sel.value = v;
					sel.addEventListener("change", () => setCells([cellSet(r, s, i, Number(sel.value))]));
					label.append(sel);
				} else {
					const out = document.createElement("output"); out.textContent = fmt(f, v);
					const name = document.createElement("span"); name.textContent = f.name + " ";
					name.append(out);
					const range = document.createElement("input");
					range.type = "range"; range.min = f.min; range.max = f.max; range.step = f.step || (f.max - f.min) / 100; range.value = v; range.dataset.f = i;
					range.addEventListener("input", () => { out.textContent = fmt(f, Number(range.value)); setCells([cellSet(r, s, i, Number(range.value))]); });
					label.append(name, range);
				}
				insp.append(label);
			});
			const reset = document.createElement("button"); reset.textContent = "Reset step";
			reset.addEventListener("click", () => { setCells(d.fields.map((f, i) => cellSet(r, s, i, f.default))); inspect(); });
			insp.append(reset);
		} else if (selectedRow !== null) {
			const r = selectedRow, len = lengths[r];
			const t = div("title"); t.textContent = d.rows[r]; insp.append(t);
			const button = (text, f) => { const b = document.createElement("button"); b.textContent = text; b.addEventListener("click", f); insp.append(b); return b; };
			const slider = (name, min, max, value) => {
				const label = document.createElement("label"), out = document.createElement("output");
				const range = document.createElement("input"); range.type = "range"; range.min = min; range.max = max; range.step = 1; range.value = value;
				out.textContent = value; range.addEventListener("input", () => out.textContent = range.value);
				const span = document.createElement("span"); span.textContent = name + " "; span.append(out);
				label.append(span, range); insp.append(label); return range;
			};
			const rowCells = () => { const list = []; for (let s = 0; s < S; s++) for (let f = 0; f < F; f++) list.push(cells[idx(pattern, r, s, f)]); return list; };
			button("Clear", () => { const list = []; for (let s = 0; s < S; s++) d.fields.forEach((f, i) => list.push(cellSet(r, s, i, f.default))); setCells(list); });
			const shift = by => {
				const old = rowCells(), list = [];
				for (let s = 0; s < len; s++) for (let f = 0; f < F; f++) list.push(cellSet(r, (s + by + len) % len, f, old[s * F + f]));
				setCells(list);
			};
			button("←", () => shift(-1)).title = "shift left";
			button("→", () => shift(1)).title = "shift right";
			const hits = slider("hits", 0, len, Math.min(4, len)), rot = slider("rotate", 0, Math.max(0, len - 1), 0);
			button("Euclid", () => {
				const k = Number(hits.value), o = Number(rot.value), list = [];
				for (let s = 0; s < len; s++) {
					const i = (s - o + len) % len;
					const on = k > 0 && Math.floor(i * k / len) !== Math.floor((i - 1) * k / len) || (k > 0 && i === 0);
					const was = cells[idx(pattern, r, s, 0)];
					list.push(cellSet(r, s, 0, on ? (was > level.default ? was : onValue) : level.default));
				}
				setCells(list);
			}).title = "spread the hits as evenly as possible";
			const density = slider("density %", 0, 100, 30);
			button("Random", () => {
				const list = [];
				for (let s = 0; s < len; s++) list.push(cellSet(r, s, 0, Math.random() * 100 < Number(density.value) ? onValue : level.default));
				setCells(list);
			});
		} else {
			insp.textContent = "tap a step to switch it, drag to paint; right click, long press or shift click a step to edit it; tap a row name for its tools";
		}
	}

	function render() {
		patButtons.forEach((b, i) => { b.classList.toggle("on", i === pattern); b.classList.toggle("playing", i === playing); });
		if (copyTo) { // never to itself
			Array.from(copyTo.options).forEach((o, i) => o.disabled = i === pattern);
			if (Number(copyTo.value) === pattern) copyTo.value = (pattern + 1) % d.patterns;
		}
		for (let r = 0; r < R; r++) {
			rowEls[r].classList.toggle("selected", selectedRow === r);
			for (let s = 0; s < S; s++) {
				const c = cellEls[r][s], v = cells[idx(pattern, r, s, 0)];
				const norm = (v - level.min) / ((level.max - level.min) || 1);
				c.querySelector(".fill").style.opacity = v > level.default ? 0.35 + 0.65 * norm : 0;
				let marked = false;
				const tip = [];
				for (let f = 1; f < F; f++) {
					const fv = cells[idx(pattern, r, s, f)];
					if (fv !== d.fields[f].default) { marked = true; tip.push(`${d.fields[f].name} ${fmt(d.fields[f], fv)}`); }
				}
				c.classList.toggle("marked", marked && v > level.default);
				c.title = v > level.default ? [`${level.name} ${fmt(level, v)}`, ...tip].join(", ") : "";
				c.classList.toggle("head", heads[r] === s && playing === pattern);
				c.classList.toggle("out", s >= lengths[r]);
				c.classList.toggle("selected", !!selected && selected.r === r && selected.s === s);
			}
		}
	}

	render(); inspect();
	return {
		el, show: () => {},
		update: u => {
			if (u.cells) cells = u.cells;
			pattern = u.pattern; playing = u.playing;
			if (u.playheads) heads = u.playheads;
			if (u.lengths) { const changed = String(u.lengths) !== String(lengths); lengths = u.lengths; if (changed && selectedRow !== null) inspect(); }
			render();
			if (u.cells) inspect(true);
		},
	};
}

const builders = {fader, knob, toggle, button, select: choice, meter, grid};

// MIDI learn: in learn mode a tap on a control arms it (its value stays), the next control change
// from the controller binds to it; the × next to a binding takes it away
let learnMode = false;
function setLearnMode(on, local = true) {
	learnMode = on;
	document.body.classList.toggle("learn", on);
	document.getElementById("learn").classList.toggle("on", on);
	if (!on && local) post("/api/learn", {name: ""});
}
document.getElementById("learn").addEventListener("click", () => setLearnMode(!learnMode));
document.addEventListener("keydown", e => { if (e.key === "Escape" && learnMode) setLearnMode(false); });

function bindable(w, p) {
	const tag = document.createElement("div");
	tag.className = "cc";
	tag.innerHTML = '<span class="label"></span><span class="unbind" title="unbind">×</span>';
	w.el.append(tag);
	w.el.classList.add("bindable");
	w.binding = b => {
		tag.querySelector(".label").textContent = b ? (b.channel ? `ch ${b.channel} · ` : "") + `CC ${b.controller}` : "";
		tag.querySelector(".unbind").style.visibility = b ? "visible" : "hidden";
	};
	w.binding(p.cc);
	// in learn mode the control doesn't move: the tap arms it (capture: before the control sees it)
	const learn = e => {
		if (!learnMode) return;
		e.stopPropagation();
		e.preventDefault();
		if (e.type !== "pointerdown") return;
		if (e.target.classList.contains("unbind")) post("/api/unbind", {name: p.name});
		else post("/api/learn", {name: p.name});
	};
	for (const type of ["pointerdown", "click", "dblclick", "keydown"]) w.el.addEventListener(type, learn, true);
}

function showMIDI(m) {
	if (m.learning && !learnMode) setLearnMode(true, false); // armed elsewhere: show it here too
	for (const [name, w] of Object.entries(widgets)) {
		if (w.binding) w.binding(m.bindings[name]);
		w.el.classList.toggle("armed", name === m.learning);
	}
}

async function build() {
	const d = await (await fetch("/api/panel")).json();
	document.title = d.title;
	document.getElementById("title").textContent = d.title;
	const main = document.getElementById("panel");
	for (const s of d.sections) {
		const sec = document.createElement("section");
		const h = document.createElement("h2"); h.textContent = s.name;
		const row = document.createElement("div"); row.className = "controls";
		sec.append(h, row);
		for (const p of s.controls) {
			const w = builders[p.kind](p);
			w.param = p;
			widgets[p.name] = w;
			w.show(p.value);
			if (p.kind !== "meter" && p.kind !== "grid") bindable(w, p);
			row.append(w.el);
		}
		main.append(sec);
	}
	presets(d.presets);
	listen();
}

// a short message in the header
let noteTimer = null;
function note(text, error) {
	const n = document.getElementById("note");
	n.textContent = text; n.classList.toggle("error", !!error);
	clearTimeout(noteTimer);
	noteTimer = setTimeout(() => n.textContent = "", error ? 6000 : 2500);
}

// presets: save, load and delete setups by name (when the panel keeps them), download and upload one
function presets(enabled) {
	const bar = document.getElementById("presets");
	bar.hidden = false;
	const el = (tag, text, title) => { const e = document.createElement(tag); if (text) e.textContent = text; if (title) e.title = title; return e; };
	let names = [], fill = () => {};
	const answer = async res => {
		if (!res.ok) { note((await res.text()).trim(), true); return false; }
		names = (await res.json()).names || [];
		fill();
		return true;
	};
	const act = async (action, name) => {
		try { return await answer(await fetch("/api/presets", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action, name})})); }
		catch (e) { note("no connection", true); return false; }
	};
	if (enabled) {
		const input = el("input"); input.placeholder = "name"; input.maxLength = 64;
		input.setAttribute("aria-label", "preset name");
		const save = el("button", "Save", "save the setup under this name");
		const choice = el("select", "", "a saved setup");
		const load = el("button", "Load", "set the panel to this setup");
		const del = el("button", "Delete", "delete this setup");
		const sep = el("span"); sep.className = "sep";
		bar.append(input, save, choice, load, del, sep);
		fill = () => {
			const keep = choice.value;
			choice.innerHTML = "";
			if (!names.length) { const o = el("option", "no presets"); o.value = ""; choice.append(o); }
			for (const n of names) { const o = el("option", n); o.value = n; choice.append(o); }
			if (names.includes(keep)) choice.value = keep;
			load.disabled = del.disabled = !names.length;
		};
		const doSave = async () => {
			const name = input.value.trim();
			if (!name) { input.focus(); note("give the preset a name", true); return; }
			if (names.includes(name) && !confirm(`Replace preset "${name}"?`)) return;
			if (await act("save", name)) { choice.value = name; input.value = ""; note(`saved "${name}"`); }
		};
		save.addEventListener("click", doSave);
		input.addEventListener("keydown", e => { if (e.key === "Enter") doSave(); });
		load.addEventListener("click", async () => { const n = choice.value; if (n && await act("load", n)) note(`loaded "${n}"`); });
		del.addEventListener("click", async () => {
			const n = choice.value;
			if (n && confirm(`Delete preset "${n}"?`) && await act("delete", n)) note(`deleted "${n}"`);
		});
		fetch("/api/presets").then(answer).catch(() => {});
	}
	const down = el("button", "Download", "the setup as a file");
	down.addEventListener("click", () => { const a = el("a"); a.href = "/api/snapshot?download"; a.download = ""; document.body.append(a); a.click(); a.remove(); });
	const file = el("input"); file.type = "file"; file.accept = ".json,application/json"; file.hidden = true;
	const up = el("button", "Upload", "set the panel to a setup from a file");
	up.addEventListener("click", () => file.click());
	file.addEventListener("change", async () => {
		const f = file.files[0];
		file.value = "";
		if (!f) return;
		try {
			const values = JSON.parse(await f.text());
			const res = await fetch("/api/snapshot", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(values)});
			if (!res.ok) throw new Error((await res.text()).trim());
			note(`loaded ${f.name}`);
		} catch (e) { note(`${f.name}: ${e.message}`, true); }
	});
	bar.append(down, up, file);
}

function listen() {
	const status = document.getElementById("status");
	const events = new EventSource("/api/events");
	events.onopen = () => status.classList.add("on");
	events.onerror = () => status.classList.remove("on");
	events.onmessage = e => {
		status.classList.add("on");
		const u = JSON.parse(e.data);
		for (const [name, v] of Object.entries(u.values || {})) {
			if (!touching.has(name) && widgets[name]) widgets[name].show(v);
		}
		for (const [name, lv] of Object.entries(u.meters || {})) {
			if (widgets[name] && widgets[name].levels) widgets[name].levels(lv);
		}
		if (u.midi) showMIDI(u.midi);
		for (const [name, gu] of Object.entries(u.grids || {})) {
			if (widgets[name] && widgets[name].update) widgets[name].update(gu);
		}
	};
}

build();
</script>
